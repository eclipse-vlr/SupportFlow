name: supportflow
services:
  db:
    image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportflow_local}
      POSTGRES_DB: supportflow
    ports:
      - "127.0.0.1:${DATABASE_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportflow -d supportflow"]
      interval: 2s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://supportflow:${POSTGRES_PASSWORD:-supportflow_local}@db:5432/supportflow?sslmode=disable"
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_MODEL: ${YANDEX_MODEL:-aliceai-llm-flash}
      YANDEX_BASE_URL: ${YANDEX_BASE_URL:-https://ai.api.cloud.yandex.net/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      WORKERS: ${WORKERS:-2}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30s}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-1500}
      MAX_QUEUED_TICKETS: ${MAX_QUEUED_TICKETS:-100}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 20s
  check:
    profiles: [tools]
    image: golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
    working_dir: /src
    volumes:
      - .:/src
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: "postgres://supportflow:${POSTGRES_PASSWORD:-supportflow_local}@db:5432/supportflow?sslmode=disable"
      LLM_PROVIDER: demo
      OPENAI_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "test -z \"$$(gofmt -l cmd internal)\" && go vet ./... && go test -race -count=1 ./... && go mod verify && go run ./cmd/eval -allow-demo -limit 0"]
volumes:
  postgres_data:
  go_modules:
  go_build:
